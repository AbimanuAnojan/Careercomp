<!DOCTYPE html>
<html>
<head>
    <title>Career Guidance</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Career Guidance Portal</h1>
</header>

<!-- STEP 1 -->
<div id="step1">
    <h2>Select Your Level</h2>

    <select id="level">
        <option value="">--Choose--</option>
        <option value="10">10th</option>
        <option value="11">11th</option>
        <option value="12">12th</option>
        <option value="ug">UG</option>
        <option value="pg">PG</option>
    </select>

    <br><br>
    <button onclick="nextStep()">Next</button>
</div>

<!-- STEP 2 -->
<div id="step2" style="display:none;">
    <h2 id="dynamicQuestion"></h2>

    <!-- dropdown will change dynamically -->
    <select id="extraInput"></select>

    <br><br>
    <button onclick="showResult()">Get Guidance</button>
</div>

<!-- RESULT -->
<div id="result"></div>

<script>

function nextStep() {
    let level = document.getElementById("level").value;

    if (level === "") {
        alert("Please select your level");
        return;
    }

    document.getElementById("step1").style.display = "none";
    document.getElementById("step2").style.display = "block";

    let dropdown = document.getElementById("extraInput");
    dropdown.innerHTML = ""; // clear old options

    if (level === "10" || level === "11" || level === "12") {

        document.getElementById("dynamicQuestion").innerText = "Select your board";

        dropdown.innerHTML = `
            <option value="cbse">CBSE</option>
            <option value="icse">ICSE</option>
            <option value="state">State Board</option>
        `;

    } else {

        document.getElementById("dynamicQuestion").innerText = "Select your college";

        dropdown.innerHTML = `
            <option value="iit">IIT</option>
            <option value="nit">NIT</option>
            <option value="vit">VIT</option>
            <option value="srm">SRM</option>
        `;
    }
}

function showResult() {

    let input = document.getElementById("extraInput").value;
    let result = document.getElementById("result");

    const data = {
        cbse: "Focus on NCERT + JEE/NEET.",
        icse: "Strong fundamentals, good for exams.",
        state: "Board + extra entrance prep needed.",
        iit: "Top tier: focus on coding + internships.",
        nit: "Core + internships important.",
        vit: "Projects + placements focus.",
        srm: "Build strong portfolio."
    };

    result.innerHTML = `<h2>${input.toUpperCase()}</h2><p>${data[input]}</p>`;
}

</script>

</body>
</html>
