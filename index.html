<!DOCTYPE html>
<html>
<head>
    <title>Career Guidance Pro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Career Guidance Portal</h1>
    <p>Personalized career advice based on your level</p>
</header>

<div class="container">

    <!-- STEP 1 -->
    <div id="step1">
        <h2>Select Your Level</h2>
        <select id="level">
            <option value="">--Choose--</option>
            <option value="10">10th</option>
            <option value="11">11th</option>
            <option value="12">12th</option>
            <option value="ug">Undergraduate</option>
            <option value="pg">Postgraduate</option>
        </select>
        <button onclick="nextStep()">Next</button>
    </div>

    <!-- STEP 2 -->
    <div id="step2" style="display:none;">
        <h2 id="dynamicQuestion"></h2>
        <input type="text" id="extraInput" placeholder="Type here...">
        <button onclick="showResult()">Get Guidance</button>
    </div>

    <!-- RESULT -->
    <div id="result"></div>

</div>

<script>

let selectedLevel = "";

function nextStep() {
    selectedLevel = document.getElementById("level").value;

    if (selectedLevel === "") {
        alert("Please select something");
        return;
    }

    document.getElementById("step1").style.display = "none";
    document.getElementById("step2").style.display = "block";

    if (selectedLevel === "10" || selectedLevel === "11" || selectedLevel === "12") {
        document.getElementById("dynamicQuestion").innerText = "Which board are you studying in? (CBSE, ICSE, State Board)";
    } else {
        document.getElementById("dynamicQuestion").innerText = "Which college are you studying in?";
    }
}

function showResult() {
    let input = document.getElementById("extraInput").value.toLowerCase();
    let result = document.getElementById("result");

    // SCHOOL LOGIC
    if (selectedLevel === "10") {
        result.innerHTML = "<h2>After 10th</h2><p>Choose stream: Science, Commerce, or Arts based on interest.</p>";
    }

    else if (selectedLevel === "11" || selectedLevel === "12") {

        if (input.includes("cbse")) {
            result.innerHTML = "<h2>CBSE Student</h2><p>Focus on NCERT strongly. Prepare for JEE / NEET.</p>";
        } 
        else if (input.includes("state")) {
            result.innerHTML = "<h2>State Board Student</h2><p>Focus on board exams + extra coaching for competitive exams.</p>";
        } 
        else {
            result.innerHTML = "<h2>General Advice</h2><p>Choose your career path based on your stream and interest.</p>";
        }
    }

    // COLLEGE LOGIC
    else if (selectedLevel === "ug") {

        if (input.includes("iit")) {
            result.innerHTML = "<h2>IIT Student</h2><p>Focus on internships, coding, and placements.</p>";
        } 
        else if (input.includes("arts")) {
            result.innerHTML = "<h2>Arts College</h2><p>Explore UPSC, MBA, or specialization.</p>";
        } 
        else {
            result.innerHTML = "<h2>UG Student</h2><p>Build skills, internships, and networking.</p>";
        }
    }

    else if (selectedLevel === "pg") {
        result.innerHTML = "<h2>Postgraduate</h2><p>Focus on specialization, research, or job placement.</p>";
    }
}

</script>

</body>
</html>
