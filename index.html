<!DOCTYPE html>
<html>
<head>
    <title>Career Guidance</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Career Guidance Portal</h1>
    <p>Find the best career path for you</p>
</header>

<section class="search">
    <input type="text" id="careerInput" placeholder="Enter your interest (e.g. engineering, medicine)">
    <button onclick="showCareer()">Search</button>
</section>

<section id="result"></section>

<script>
function showCareer() {
    let input = document.getElementById("careerInput").value.toLowerCase();
    let result = document.getElementById("result");

    if (input.includes("engineering")) {
        result.innerHTML = "<h2>Engineering</h2><p>Study PCM, clear JEE, join top colleges like IITs or NITs.</p>";
    } 
    else if (input.includes("medicine")) {
        result.innerHTML = "<h2>Medicine</h2><p>Study PCB, clear NEET, pursue MBBS.</p>";
    } 
    else if (input.includes("commerce")) {
        result.innerHTML = "<h2>Commerce</h2><p>Careers: CA, BBA, MBA, Finance.</p>";
    } 
    else {
        result.innerHTML = "<p>No data found. Try engineering, medicine, or commerce.</p>";
    }
}
</script>

</body>
</html>
